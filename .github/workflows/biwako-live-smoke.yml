name: Biwako public API smoke diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public read-only API once
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          base = 'https://boat-ai-prediction.onrender.com'
          for path in ['/health', '/api/biwako_tactics?date=20261114&stadium=11&race=1']:
              start = time.monotonic()
              try:
                  with urllib.request.urlopen(urllib.request.Request(
                      base + path, headers={'User-Agent': 'BOAT-AI smoke diagnostic/1.0', 'Accept-Encoding': 'identity'}), timeout=48) as response:
                      body=response.read(4096).decode('utf-8',errors='replace')
                      print(json.dumps({'path':path.split('?')[0], 'status':response.status,
                                        'elapsed_seconds':round(time.monotonic()-start,2),
                                        'body_prefix':body[:1100]},ensure_ascii=False),flush=True)
              except urllib.error.HTTPError as e:
                  body=e.read(2048).decode('utf-8',errors='replace')
                  print(json.dumps({'path':path.split('?')[0], 'status':e.code,
                                    'elapsed_seconds':round(time.monotonic()-start,2),
                                    'body_prefix':body[:1100]},ensure_ascii=False),flush=True)
              except Exception as e:
                  print(json.dumps({'path':path.split('?')[0], 'error':type(e).__name__,
                                    'elapsed_seconds':round(time.monotonic()-start,2),
                                    'message':str(e)[:250]},ensure_ascii=False),flush=True)
          PY
